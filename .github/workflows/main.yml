name: RDP-AnyDesk-7-Days

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pc-virtual:
    runs-on: windows-latest
    # O timeout do job deve ser maior que 7 dias se possível, 
    # mas como o GitHub limita jobs, vamos usar um truque:
    # Vamos manter o processo vivo e reiniciar se necessário.
    
    steps:
      - name: Instalar AnyDesk e configurar
        run: |
          $chars = "abcdefghjkmnpqrstuvwxyz23456789".ToCharArray()
          $pw = "Ab3-" + (-join ($chars | Get-Random -Count 10))

          $ad = "C:\AnyDesk\AnyDesk.exe"
          
          # Baixar e instalar AnyDesk
          Invoke-WebRequest -Uri "https://download.anydesk.com/AnyDesk.exe" -OutFile "$env:TEMP\AnyDesk.exe"
          Start-Process "$env:TEMP\AnyDesk.exe" -ArgumentList "--install C:\AnyDesk --start-with-win --silent" -Wait

          # Verificar se instalou
          for ($i = 0; $i -lt 40 -and -not (Test-Path $ad); $i++) { 
              Start-Sleep -Seconds 3 
          }
          if (-not (Test-Path $ad)) {
              Write-Error "AnyDesk nao foi instalado"
              exit 1
          }

          # Definir senha
          cmd /c "echo $pw | ""$ad"" --set-password"
          Start-Sleep -Seconds 5

          # Obter ID
          $id = ""
          for ($i = 0; $i -lt 12 -and -not $id; $i++) {
              $id = (& $ad --get-id | Out-String).Trim()
              if (-not $id) { Start-Sleep -Seconds 5 }
          }
          if (-not $id) {
              Write-Error "Nao consegui obter o ID do AnyDesk"
              exit 1
          }

          Write-Host ""
          Write-Host "=============================="
          Write-Host "ID:    $id"
          Write-Host "SENHA: $pw"
          Write-Host "=============================="

      - name: Manter ativo por 7 dias (Loop Infinito)
        run: |
          # Script PowerShell para manter o AnyDesk ativo e reiniciar se necessário
          $anydeskPath = "C:\AnyDesk\AnyDesk.exe"
          $logFile = "C:\anydesk_keepalive.log"
          
          function Log-Message {
              param($Message)
              $timestamp = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
              "$timestamp - $Message" | Out-File -FilePath $logFile -Append
              Write-Host $Message
          }

          Log-Message "Iniciando loop de manutenção..."

          while ($true) {
              try {
                  # Verificar se o AnyDesk está rodando
                  $process = Get-Process -Name "AnyDesk" -ErrorAction SilentlyContinue
                  
                  if (-not $process) {
                      Log-Message "AnyDesk não está rodando. Reiniciando..."
                      Start-Process $anydeskPath -WindowStyle Minimized
                      Start-Sleep -Seconds 10
                  } else {
                      Log-Message "AnyDesk está rodando. Aguardando 60 segundos..."
                      Start-Sleep -Seconds 60
                  }
              } catch {
                  Log-Message "Erro ao verificar AnyDesk: $_"
                  Start-Sleep -Seconds 10
              }
          }
